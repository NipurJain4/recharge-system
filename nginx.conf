server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Main site
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health endpoint for Kubernetes liveness/readiness probes
    # and Flagger canary analysis. Returns 200 with "OK".
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }
}
